<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OrSzer - Hírközlő és Közösségi Portál</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        #content-container {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div id="content-container">Munkamenet felépítése az OrSzer szerverével...</div>

    <script>
        const ngrokUrl = "https://7627-2a01-36d-2700-27b2-3697-f6ff-fe33-7f90.ngrok-free.app";
        
        // Elküldjük a titkos fejlécet, ami átugorja az ngrok reklámoldalát
        fetch(ngrokUrl, {
            headers: {
                "ngrok-skip-browser-warning": "true"
            }
        })
        .then(response => response.text())
        .then(html => {
            // Beillesztjük a kapott weboldalt, és átírjuk a belső linkeket, hogy az ngrok-ra mutassanak
            const container = document.getElementById("content-container");
            container.innerHTML = html;
            
            // iFrame-ként ágyazzuk be újra, de már a feloldott sessionnel
            container.innerHTML = `<iframe src="${ngrokUrl}" style="width:100%; height:100%; border:none;"></iframe>`;
        })
        .catch(err => {
            document.getElementById("content-container").innerHTML = "Szerver kapcsolódási hiba. Kérjük frissítsd az oldalt!";
            console.error(err);
        });
    </script>
</body>
</html>
